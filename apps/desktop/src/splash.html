<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DeepSeek Harness</title>
  <style>
    :root { color-scheme: light; font-family: "Segoe UI", "Microsoft YaHei UI", sans-serif; }
    * { box-sizing: border-box; }
    body { align-items: center; background: #f7f8fa; color: #171a20; display: flex; height: 100vh; justify-content: center; margin: 0; }
    main { align-items: center; display: flex; flex-direction: column; gap: 18px; }
    .brand { font-size: 22px; font-weight: 650; letter-spacing: 0; }
    .brand small { background: #171a20; border-radius: 3px; color: #fff; font-size: 10px; letter-spacing: .7px; margin-left: 7px; padding: 3px 5px; vertical-align: 3px; }
    .spinner { animation: spin .8s linear infinite; border: 2px solid #d6dbe3; border-radius: 50%; border-top-color: #2676e3; height: 22px; width: 22px; }
    p { color: #687386; font-size: 14px; margin: 0; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <main>
    <div class="brand">deepseek<small>HARNESS</small></div>
    <div class="spinner" aria-label="Loading"></div>
    <p>正在启动工作区服务</p>
  </main>
</body>
</html>
